name: AWS canonical runtime deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-canonical-runtime.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ripple-aws-canonical-runtime
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: '873363353521'
      ECR_REPOSITORY: ripple-canonical-runtime
      SERVICE_NAME: ripple-canonical
      CLUSTER_NAME: default
      TABLE_NAME: ripple-canonical-state
      TRACE_LOG_GROUP: /ripple/canonical/runtime
      TRACE_LOG_STREAM: runtime
      CONTAINER_LOG_GROUP: /ecs/ripple-canonical
      EXECUTION_ROLE: RippleEcsTaskExecutionRole
      INFRA_ROLE: RippleEcsInfrastructureRole
      TASK_ROLE: RippleEcsTaskRole
      SERVICE_CLIENT_ID: ripple-service
      USER_CLIENT_ID: ripple-user
      SERVICE_SECRET_PARAM: /ripple/canonical/service-client-secret
      DEMO_PASSWORD_PARAM: /ripple/canonical/demo-user-password
      BEDROCK_MODEL_ID: eu.amazon.nova-2-lite-v1:0
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-aws-canonical-deploy
          retry-max-attempts: 2

      - name: Verify cutover authorization
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "$ARN" in
            arn:aws:sts::*:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo "Unexpected AWS identity" >&2; exit 1 ;;
          esac
          aws iam get-role-policy \
            --role-name RippleGitHubOidcRole \
            --policy-name RippleCanonicalRuntimeCutoverPolicy \
            --query PolicyName --output text | grep -qx RippleCanonicalRuntimeCutoverPolicy
          echo 'CUTOVER_AUTHORIZATION=PASS'

      - name: Ensure canonical DynamoDB and CloudWatch resources
        shell: bash
        run: |
          set -euo pipefail
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --billing-mode PAY_PER_REQUEST \
              --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
              --tags Key=Project,Value=Ripple Key=Purpose,Value=canonical-runtime >/dev/null
          fi
          aws dynamodb wait table-exists --table-name "$TABLE_NAME"
          test "$(aws dynamodb describe-table --table-name "$TABLE_NAME" --query 'Table.TableStatus' --output text)" = ACTIVE

          if ! aws logs describe-log-groups --log-group-name-prefix "$TRACE_LOG_GROUP" \
              --query "logGroups[?logGroupName=='$TRACE_LOG_GROUP'].logGroupName" --output text | grep -qx "$TRACE_LOG_GROUP"; then
            aws logs create-log-group --log-group-name "$TRACE_LOG_GROUP"
          fi
          aws logs put-retention-policy --log-group-name "$TRACE_LOG_GROUP" --retention-in-days 14
          if ! aws logs describe-log-streams --log-group-name "$TRACE_LOG_GROUP" --log-stream-name-prefix "$TRACE_LOG_STREAM" \
              --query "logStreams[?logStreamName=='$TRACE_LOG_STREAM'].logStreamName" --output text | grep -qx "$TRACE_LOG_STREAM"; then
            aws logs create-log-stream --log-group-name "$TRACE_LOG_GROUP" --log-stream-name "$TRACE_LOG_STREAM"
          fi

          if ! aws logs describe-log-groups --log-group-name-prefix "$CONTAINER_LOG_GROUP" \
              --query "logGroups[?logGroupName=='$CONTAINER_LOG_GROUP'].logGroupName" --output text | grep -qx "$CONTAINER_LOG_GROUP"; then
            aws logs create-log-group --log-group-name "$CONTAINER_LOG_GROUP"
          fi
          aws logs put-retention-policy --log-group-name "$CONTAINER_LOG_GROUP" --retention-in-days 7
          echo 'CANONICAL_DATA_AND_LOGS=PASS'

      - name: Ensure strong AWS-only runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          if ! aws ssm get-parameter --name "$SERVICE_SECRET_PARAM" >/dev/null 2>&1; then
            VALUE="$(openssl rand -hex 32)"
            aws ssm put-parameter --name "$SERVICE_SECRET_PARAM" --type SecureString --value "$VALUE" >/dev/null
          fi
          if ! aws ssm get-parameter --name "$DEMO_PASSWORD_PARAM" >/dev/null 2>&1; then
            VALUE="$(openssl rand -hex 24)"
            aws ssm put-parameter --name "$DEMO_PASSWORD_PARAM" --type SecureString --value "$VALUE" >/dev/null
          fi
          echo 'AWS_RUNTIME_SECRETS=PASS'

      - name: Ensure ECR repository and push exact-SHA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true >/dev/null
          fi
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo 'ECR_IMAGE_ACTION=REUSED'
          else
            docker build --pull -t "$ECR_URI:$GITHUB_SHA" .
            docker push "$ECR_URI:$GITHUB_SHA"
            echo 'ECR_IMAGE_ACTION=PUSHED'
          fi
          DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$DIGEST" && test "$DIGEST" != None
          IMAGE_REF="$ECR_URI@$DIGEST"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo 'EXACT_SHA_ECR_IMAGE=PASS'

      - name: Ensure ECS roles with least-privilege runtime policy
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/task-trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          JSON
          cat >/tmp/infra-trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          JSON

          if ! aws iam get-role --role-name "$EXECUTION_ROLE" >/dev/null 2>&1; then
            aws iam create-role --role-name "$EXECUTION_ROLE" --assume-role-policy-document file:///tmp/task-trust.json >/dev/null
          fi
          if ! aws iam get-role --role-name "$INFRA_ROLE" >/dev/null 2>&1; then
            aws iam create-role --role-name "$INFRA_ROLE" --assume-role-policy-document file:///tmp/infra-trust.json >/dev/null
          fi
          if ! aws iam get-role --role-name "$TASK_ROLE" >/dev/null 2>&1; then
            aws iam create-role --role-name "$TASK_ROLE" --assume-role-policy-document file:///tmp/task-trust.json >/dev/null
          fi

          aws iam attach-role-policy --role-name "$EXECUTION_ROLE" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
          aws iam attach-role-policy --role-name "$INFRA_ROLE" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

          cat >/tmp/execution-inline.json <<JSON
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Effect":"Allow",
              "Action":["ssm:GetParameter","ssm:GetParameters"],
              "Resource":[
                "arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/service-client-secret",
                "arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/demo-user-password"
              ]
            }]
          }
          JSON
          aws iam put-role-policy --role-name "$EXECUTION_ROLE" --policy-name RippleCanonicalSecretRead --policy-document file:///tmp/execution-inline.json

          cat >/tmp/runtime-inline.json <<JSON
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"CanonicalState",
                "Effect":"Allow",
                "Action":["dynamodb:GetItem","dynamodb:PutItem","dynamodb:DescribeTable"],
                "Resource":"arn:aws:dynamodb:${AWS_REGION}:${AWS_ACCOUNT_ID}:table/${TABLE_NAME}"
              },
              {
                "Sid":"CanonicalTrace",
                "Effect":"Allow",
                "Action":"logs:PutLogEvents",
                "Resource":"arn:aws:logs:${AWS_REGION}:${AWS_ACCOUNT_ID}:log-group:${TRACE_LOG_GROUP}:log-stream:${TRACE_LOG_STREAM}"
              },
              {
                "Sid":"CanonicalBedrock",
                "Effect":"Allow",
                "Action":"bedrock:InvokeModel",
                "Resource":[
                  "arn:aws:bedrock:*::foundation-model/amazon.nova-*",
                  "arn:aws:bedrock:*:${AWS_ACCOUNT_ID}:inference-profile/*"
                ]
              }
            ]
          }
          JSON
          aws iam put-role-policy --role-name "$TASK_ROLE" --policy-name RippleCanonicalRuntimePolicy --policy-document file:///tmp/runtime-inline.json

          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/tmp/slr.out 2>/tmp/slr.err || {
            grep -qi 'has been taken\|already exists\|EntityAlreadyExists' /tmp/slr.err || { cat /tmp/slr.err; exit 1; }
          }
          echo 'ECS_RUNTIME_ROLES=PASS'

      - name: Ensure default ECS cluster
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[0].status' --output text 2>/dev/null || true)"
          if [ "$STATUS" != ACTIVE ]; then
            aws ecs create-cluster --cluster-name "$CLUSTER_NAME" >/dev/null
          fi
          test "$(aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[0].status' --output text)" = ACTIVE
          echo 'ECS_CLUSTER=PASS'

      - name: Create or update canonical ECS Express service
        id: service
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          EXEC_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EXECUTION_ROLE}"
          INFRA_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${INFRA_ROLE}"
          TASK_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TASK_ROLE}"
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/${CLUSTER_NAME}/${SERVICE_NAME}"
          BASE_URL="https://${SERVICE_NAME}.ecs.${AWS_REGION}.on.aws"
          SECRET_ARN="arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/service-client-secret"
          PASSWORD_ARN="arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/demo-user-password"

          IMAGE_REF="$IMAGE_REF" BASE_URL="$BASE_URL" SECRET_ARN="$SECRET_ARN" PASSWORD_ARN="$PASSWORD_ARN" python - <<'PY'
          import json, os
          primary = {
              "image": os.environ["IMAGE_REF"],
              "containerPort": 8000,
              "awsLogsConfiguration": {"logGroup": "/ecs/ripple-canonical", "logStreamPrefix": "ecs"},
              "environment": [
                  {"name":"PORT","value":"8000"},
                  {"name":"AWS_REGION","value":"eu-central-1"},
                  {"name":"RIPPLE_ENV","value":"production"},
                  {"name":"RIPPLE_PUBLIC_BASE_URL","value":os.environ["BASE_URL"]},
                  {"name":"RIPPLE_ALLOWED_ORIGINS","value":os.environ["BASE_URL"]},
                  {"name":"RIPPLE_SERVICE_CLIENT_ID","value":"ripple-service"},
                  {"name":"RIPPLE_USER_CLIENT_ID","value":"ripple-user"},
                  {"name":"RIPPLE_USER_REDIRECT_URIS","value":os.environ["BASE_URL"]+"/oauth/callback"},
                  {"name":"RIPPLE_STATE_BACKEND","value":"dynamodb"},
                  {"name":"RIPPLE_DYNAMODB_TABLE","value":"ripple-canonical-state"},
                  {"name":"RIPPLE_CHANGE_INTERPRETER","value":"bedrock"},
                  {"name":"RIPPLE_BEDROCK_MODEL_ID","value":"eu.amazon.nova-2-lite-v1:0"},
                  {"name":"RIPPLE_TRACE_BACKEND","value":"cloudwatch"},
                  {"name":"RIPPLE_CLOUDWATCH_LOG_GROUP","value":"/ripple/canonical/runtime"},
                  {"name":"RIPPLE_CLOUDWATCH_LOG_STREAM","value":"runtime"},
                  {"name":"RIPPLE_REQUIRE_AWS_RUNTIME","value":"true"},
                  {"name":"RAILWAY_GIT_COMMIT_SHA","value":os.environ["GITHUB_SHA"]},
                  {"name":"RIPPLE_RELEASE_SHA","value":os.environ["GITHUB_SHA"]},
              ],
              "secrets": [
                  {"name":"RIPPLE_SERVICE_CLIENT_SECRET","valueFrom":os.environ["SECRET_ARN"]},
                  {"name":"RIPPLE_DEMO_USER_PASSWORD","valueFrom":os.environ["PASSWORD_ARN"]},
              ],
          }
          json.dump(primary, open('/tmp/primary.json','w'))
          PY

          if aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" >/tmp/existing.json 2>/tmp/existing.err; then
            python - <<PY
          import json
          req={
            "serviceArn":"$SERVICE_ARN",
            "executionRoleArn":"$EXEC_ARN",
            "taskRoleArn":"$TASK_ARN",
            "healthCheckPath":"/healthz",
            "primaryContainer":json.load(open('/tmp/primary.json')),
            "cpu":"256",
            "memory":"512",
            "scalingTarget":{"minTaskCount":1,"maxTaskCount":1,"autoScalingMetric":"AVERAGE_CPU","autoScalingTargetValue":60}
          }
          json.dump(req,open('/tmp/service-request.json','w'))
          PY
            aws ecs update-express-gateway-service --cli-input-json file:///tmp/service-request.json >/tmp/service-mutation.json
            echo 'ECS_EXPRESS_ACTION=UPDATED'
          else
            python - <<PY
          import json
          req={
            "serviceName":"$SERVICE_NAME",
            "cluster":"$CLUSTER_NAME",
            "executionRoleArn":"$EXEC_ARN",
            "infrastructureRoleArn":"$INFRA_ARN",
            "taskRoleArn":"$TASK_ARN",
            "healthCheckPath":"/healthz",
            "primaryContainer":json.load(open('/tmp/primary.json')),
            "cpu":"256",
            "memory":"512",
            "scalingTarget":{"minTaskCount":1,"maxTaskCount":1,"autoScalingMetric":"AVERAGE_CPU","autoScalingTargetValue":60}
          }
          json.dump(req,open('/tmp/service-request.json','w'))
          PY
            aws ecs create-express-gateway-service --cli-input-json file:///tmp/service-request.json >/tmp/service-mutation.json
            echo 'ECS_EXPRESS_ACTION=CREATED'
          fi
          echo "service_arn=$SERVICE_ARN" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_SOURCE_SHA=$GITHUB_SHA"

      - name: Wait for public AWS HTTPS runtime
        env:
          SERVICE_ARN: ${{ steps.service.outputs.service_arn }}
          BASE_URL: ${{ steps.service.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 60); do
            aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" >/tmp/service.json
            STATUS="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/service.json'))
          print(((d.get('service') or {}).get('status') or {}).get('statusCode') or '')
          PY
          )"
            echo "attempt=$attempt service_status=$STATUS"
            if curl -fsS --max-time 8 "$BASE_URL/healthz" >/tmp/health.json 2>/tmp/curl.err; then
              READY=1
              break
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Canonical AWS endpoint did not become healthy' >&2
            cat /tmp/service.json >&2 || true
            cat /tmp/curl.err >&2 || true
            exit 1
          fi
          echo 'AWS_HTTPS_ENDPOINT=PASS'
          curl -fsS "$BASE_URL/readyz" | tee /tmp/ready.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/ready.json'))
          assert d['status']=='ready', d
          assert d['structural_aws_runtime'] is True, d
          assert d['runtime_mode']=='aws-structural', d
          assert d['aws_components']==['dynamodb','bedrock','cloudwatch'], d
          assert d.get('source_revision')==os.environ['GITHUB_SHA'].lower(), d
          print('AWS_STRUCTURAL_READINESS=PASS')
          PY

      - name: Independent public MCP and AWS-runtime smoke
        env:
          BASE_URL: ${{ steps.service.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          SERVICE_SECRET="$(aws ssm get-parameter --name "$SERVICE_SECRET_PARAM" --with-decryption --query 'Parameter.Value' --output text)"
          DEMO_PASSWORD="$(aws ssm get-parameter --name "$DEMO_PASSWORD_PARAM" --with-decryption --query 'Parameter.Value' --output text)"
          echo "::add-mask::$SERVICE_SECRET"
          echo "::add-mask::$DEMO_PASSWORD"

          RIPPLE_SMOKE_BASE_URL="$BASE_URL" \
          RIPPLE_SERVICE_CLIENT_ID="$SERVICE_CLIENT_ID" \
          RIPPLE_SERVICE_CLIENT_SECRET="$SERVICE_SECRET" \
          RIPPLE_USER_CLIENT_ID="$USER_CLIENT_ID" \
          RIPPLE_USER_REDIRECT_URI="$BASE_URL/oauth/callback" \
          RIPPLE_DEMO_USER_PASSWORD="$DEMO_PASSWORD" \
          RIPPLE_EXPECTED_SOURCE_SHA="$GITHUB_SHA" \
            python scripts/aws_runtime_smoke.py

          RIPPLE_SMOKE_BASE_URL="$BASE_URL" \
          RIPPLE_SERVICE_CLIENT_ID="$SERVICE_CLIENT_ID" \
          RIPPLE_SERVICE_CLIENT_SECRET="$SERVICE_SECRET" \
          RIPPLE_USER_CLIENT_ID="$USER_CLIENT_ID" \
          RIPPLE_USER_REDIRECT_URI="$BASE_URL/oauth/callback" \
          RIPPLE_DEMO_USER_PASSWORD="$DEMO_PASSWORD" \
            python scripts/mcp_smoke.py

          echo 'CANONICAL_AWS_PUBLIC_PROOF=PASS'

      - name: Verify CloudWatch trace readback and exact image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text | grep -qx "$IMAGE_DIGEST"
          FOUND=0
          for attempt in 1 2 3 4 5; do
            if aws logs get-log-events --log-group-name "$TRACE_LOG_GROUP" --log-stream-name "$TRACE_LOG_STREAM" \
                --start-from-head --limit 10000 --query 'events[].message' --output text >/tmp/traces.txt 2>/tmp/traces.err; then
              if grep -q 'plan.executed' /tmp/traces.txt && grep -q 'change.recorded' /tmp/traces.txt; then
                FOUND=1
                break
              fi
            fi
            sleep 2
          done
          test "$FOUND" -eq 1
          echo 'CLOUDWATCH_CANONICAL_TRACE=PASS'
          echo 'ECR_EXACT_SHA_DIGEST=PASS'
          echo "CANONICAL_AWS_RUNTIME_URL=${{ steps.service.outputs.base_url }}"
          echo "CANONICAL_AWS_RUNTIME_SHA=$GITHUB_SHA"
