name: AWS Live OIDC Probe

on:
  push:
    branches:
      - poc/free-work-replacement
    paths:
      - .github/workflows/aws-live-oidc-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: eu-central-1
      ROLE_ARN: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
      TABLE_NAME: ripple-oidc-live-state
      LOG_GROUP: /ripple/oidc-live
      BUDGET_NAME: ripple-demo-monthly
      MONTHLY_BUDGET_USD: '10'

    steps:
      - name: Checkout canonical Ripple source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ripple-aws-live-probe
          audience: sts.amazonaws.com
          retry-max-attempts: 2

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ACCOUNT" = "873363353521"
          case "$ARN" in
            arn:aws:sts::873363353521:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo "Unexpected assumed identity" >&2; exit 1 ;;
          esac
          echo "OIDC_IDENTITY=PASS"

      - name: Ensure low-cost monthly AWS budget
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if aws budgets describe-budget --account-id "$ACCOUNT" --budget-name "$BUDGET_NAME" >/dev/null 2>&1; then
            echo "AWS_BUDGET=EXISTS"
          else
            cat > /tmp/ripple-budget.json <<EOF
          {
            "BudgetName": "$BUDGET_NAME",
            "BudgetLimit": {"Amount": "$MONTHLY_BUDGET_USD", "Unit": "USD"},
            "TimeUnit": "MONTHLY",
            "BudgetType": "COST"
          }
          EOF
            aws budgets create-budget --account-id "$ACCOUNT" --budget file:///tmp/ripple-budget.json
            echo "AWS_BUDGET=CREATED"
          fi

      - name: Ensure DynamoDB live state table and prove round trip
        shell: bash
        run: |
          set -euo pipefail
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Project,Value=Ripple Key=Environment,Value=demo >/dev/null
          fi
          aws dynamodb wait table-exists --table-name "$TABLE_NAME"
          aws dynamodb put-item \
            --table-name "$TABLE_NAME" \
            --item '{"pk":{"S":"EVIDENCE#OIDC"},"sk":{"S":"LIVE#2026-09-06"},"status":{"S":"PASS"}}'
          STATUS="$(aws dynamodb get-item \
            --table-name "$TABLE_NAME" \
            --key '{"pk":{"S":"EVIDENCE#OIDC"},"sk":{"S":"LIVE#2026-09-06"}}' \
            --consistent-read \
            --query 'Item.status.S' --output text)"
          test "$STATUS" = "PASS"
          echo "DYNAMODB_ROUND_TRIP=PASS"

      - name: Ensure CloudWatch log group shell
        shell: bash
        run: |
          set -euo pipefail
          if ! aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query 'logGroups[?logGroupName==`'"$LOG_GROUP"'`].logGroupName' --output text | grep -Fxq "$LOG_GROUP"; then
            aws logs create-log-group --log-group-name "$LOG_GROUP" --tags Project=Ripple,Environment=demo
          fi
          aws logs put-retention-policy --log-group-name "$LOG_GROUP" --retention-in-days 7
          echo "CLOUDWATCH_LOG_GROUP=PASS"

      - name: Install Ripple AWS dependencies
        run: python -m pip install --disable-pip-version-check -e '.[aws]'

      - name: Run live Bedrock quality benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/aws-live
          python scripts/bedrock_benchmark.py \
            --region "$AWS_REGION" \
            --output artifacts/aws-live/BEDROCK_BENCHMARK_LIVE.md \
            --json-output artifacts/aws-live/bedrock-benchmark.json \
            --require-perfect | tee artifacts/aws-live/bedrock-benchmark.log
          grep '^RIPPLE_BEDROCK_RECOMMENDED=' artifacts/aws-live/bedrock-benchmark.log
          grep '^RIPPLE_BEDROCK_RECOMMENDED_ACCURACY=' artifacts/aws-live/bedrock-benchmark.log
          echo "BEDROCK_LIVE_BENCHMARK=PASS"

      - name: Emit sanitized AWS live evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          WINNER="$(grep '^RIPPLE_BEDROCK_RECOMMENDED=' artifacts/aws-live/bedrock-benchmark.log | tail -n1 | cut -d= -f2-)"
          ACCURACY="$(grep '^RIPPLE_BEDROCK_RECOMMENDED_ACCURACY=' artifacts/aws-live/bedrock-benchmark.log | tail -n1 | cut -d= -f2-)"
          cat <<EOF
          RIPPLE_AWS_OIDC_LIVE_BEGIN
          status=PASS
          oidc_role=RippleGitHubOidcRole
          region=$AWS_REGION
          budget_name=$BUDGET_NAME
          monthly_budget_usd=$MONTHLY_BUDGET_USD
          dynamodb_table=$TABLE_NAME
          cloudwatch_log_group=$LOG_GROUP
          bedrock_model=$WINNER
          bedrock_accuracy=$ACCURACY
          source_ref=main
          RIPPLE_AWS_OIDC_LIVE_END
          EOF

      - name: Upload non-secret live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-aws-live-${{ github.run_id }}
          path: artifacts/aws-live
          if-no-files-found: warn
          retention-days: 14
