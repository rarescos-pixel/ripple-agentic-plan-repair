name: One-shot confidence clarification boundary patch

on:
  push:
    branches: [codex/continuous-promise-preservation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/continuous-promise-preservation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal generic clarification delta
        run: python .github/scripts/patch-confidence-clarification.py
      - name: Install project and run full regression
        run: |
          python -m pip install -e . pytest
          PYTHONPATH=src python -m pytest -q
      - name: Regenerate canonical build evidence
        run: PYTHONPATH=src python scripts/promise_build_gate.py
      - name: Commit only intended delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)src/ripple/promises/interpreter.py' ':(exclude)tests/test_promise_interpreter.py' ':(exclude)docs/PROMISE_BUILD_EVIDENCE.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ripple/promises/interpreter.py tests/test_promise_interpreter.py docs/PROMISE_BUILD_EVIDENCE.json
          git commit -m 'Make clarification gating confidence-bound and fail-safe'
          git push origin HEAD:codex/continuous-promise-preservation
