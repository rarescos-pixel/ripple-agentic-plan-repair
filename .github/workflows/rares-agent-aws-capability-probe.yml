name: RaresAgent AWS capability probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rares-agent-aws-capability-probe.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials from existing GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: rares-agent-capability-probe
          retry-max-attempts: 2

      - name: Probe isolated RaresAgent writes and Bedrock invoke
        shell: bash
        run: |
          set -uo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          echo "AWS_IDENTITY=$ARN"

          TABLE='raresagent-control-plane-v1'
          echo '--- DynamoDB create ---'
          if aws dynamodb describe-table --table-name "$TABLE" >/dev/null 2>/tmp/ddb-desc.err; then
            echo 'DYNAMODB_TABLE=EXISTS'
          else
            if aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Project,Value=RaresAgent Key=Purpose,Value=ControlPlane \
              >/tmp/ddb-create.json 2>/tmp/ddb-create.err; then
              echo 'DYNAMODB_CREATE=PASS'
            else
              echo 'DYNAMODB_CREATE=DENIED_OR_FAILED'
              sed -E 's/[0-9]{12}/************/g' /tmp/ddb-create.err | head -4
            fi
          fi

          LOG_GROUP='/raresagent/control-plane-v1'
          echo '--- CloudWatch create ---'
          if aws logs create-log-group --log-group-name "$LOG_GROUP" --tags Project=RaresAgent,Purpose=ControlPlane 2>/tmp/log-create.err; then
            echo 'CLOUDWATCH_LOG_GROUP_CREATE=PASS'
          else
            if grep -q 'ResourceAlreadyExistsException' /tmp/log-create.err; then
              echo 'CLOUDWATCH_LOG_GROUP=EXISTS'
            else
              echo 'CLOUDWATCH_LOG_GROUP_CREATE=DENIED_OR_FAILED'
              sed -E 's/[0-9]{12}/************/g' /tmp/log-create.err | head -4
            fi
          fi

          echo '--- Bedrock invoke ---'
          cat >/tmp/request.json <<'JSON'
          {"messages":[{"role":"user","content":[{"text":"Reply with exactly RARESAGENT_BEDROCK_PASS"}]}],"inferenceConfig":{"maxTokens":32,"temperature":0}}
          JSON
          if aws bedrock-runtime converse \
            --region eu-central-1 \
            --model-id eu.amazon.nova-2-lite-v1:0 \
            --cli-input-json file:///tmp/request.json \
            >/tmp/bedrock-out.json 2>/tmp/bedrock-invoke.err; then
            python - <<'PY'
          import json
          data=json.load(open('/tmp/bedrock-out.json'))
          text=data.get('output',{}).get('message',{}).get('content',[{}])[0].get('text','')
          print('BEDROCK_INVOKE=PASS' if 'RARESAGENT_BEDROCK_PASS' in text else 'BEDROCK_INVOKE=UNEXPECTED_OUTPUT')
          PY
          else
            echo 'BEDROCK_INVOKE=DENIED_OR_FAILED'
            sed -E 's/[0-9]{12}/************/g' /tmp/bedrock-invoke.err | head -4
          fi

          echo 'AWS_RARESAGENT_MUTATION_PROBE=COMPLETE'
