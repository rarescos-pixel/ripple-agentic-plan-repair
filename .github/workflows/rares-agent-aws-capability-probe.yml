name: RaresAgent AWS capability probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rares-agent-aws-capability-probe.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials from existing GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: rares-agent-capability-probe
          retry-max-attempts: 2

      - name: Probe actual service capabilities read-only
        shell: bash
        run: |
          set -uo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          echo "AWS_IDENTITY=$ARN"

          echo '--- DynamoDB ---'
          if aws dynamodb list-tables --max-items 5 --output json >/tmp/ddb.json 2>/tmp/ddb.err; then
            echo 'DYNAMODB_LIST=PASS'
          else
            echo 'DYNAMODB_LIST=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/ddb.err | head -3
          fi

          echo '--- CloudWatch Logs ---'
          if aws logs describe-log-groups --limit 5 --output json >/tmp/logs.json 2>/tmp/logs.err; then
            echo 'CLOUDWATCH_LOGS_LIST=PASS'
          else
            echo 'CLOUDWATCH_LOGS_LIST=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/logs.err | head -3
          fi

          echo '--- Bedrock ---'
          if aws bedrock list-foundation-models --region eu-central-1 --by-output-modality TEXT --output json >/tmp/bedrock.json 2>/tmp/bedrock.err; then
            echo 'BEDROCK_LIST_MODELS=PASS'
          else
            echo 'BEDROCK_LIST_MODELS=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/bedrock.err | head -3
          fi

          echo '--- Lambda ---'
          if aws lambda list-functions --max-items 5 --output json >/tmp/lambda.json 2>/tmp/lambda.err; then
            echo 'LAMBDA_LIST=PASS'
          else
            echo 'LAMBDA_LIST=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/lambda.err | head -3
          fi

          echo '--- API Gateway ---'
          if aws apigateway get-rest-apis --limit 5 --output json >/tmp/apigw.json 2>/tmp/apigw.err; then
            echo 'APIGW_LIST=PASS'
          else
            echo 'APIGW_LIST=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/apigw.err | head -3
          fi

          echo 'AWS_SERVICE_CAPABILITY_PROBE=COMPLETE'
