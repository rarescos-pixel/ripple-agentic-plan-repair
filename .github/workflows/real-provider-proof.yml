name: Ripple real external-provider proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ripple/tools/github_issue.py'
      - 'scripts/github_provider_live_proof.py'
      - 'tests/test_github_issue_provider.py'
      - '.github/workflows/real-provider-proof.yml'

permissions:
  contents: read
  issues: write

jobs:
  github-issue-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ripple
        run: python -m pip install -e .
      - name: Run deterministic provider contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_github_issue_provider.py' -v
        continue-on-error: true
      - name: Exercise bounded real GitHub issue write, readback, replay and restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RIPPLE_PROVIDER_ISSUE: '42'
          RIPPLE_PROVIDER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: PYTHONPATH=src python scripts/github_provider_live_proof.py
