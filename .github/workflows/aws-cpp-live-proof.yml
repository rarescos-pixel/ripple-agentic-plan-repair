name: AWS CPP isolated live proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aws-cpp-live-proof.yml'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: eu-central-1
      EXPECTED_SHA: 8b939542d5055f5c6c308cacdcd66667d71a0b68
    steps:
      - name: Checkout exact verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Prove exact source under test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"

      - name: Configure AWS credentials from existing GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-cpp-proof
          retry-max-attempts: 2

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "$ARN" in
            arn:aws:sts::*:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo 'Unexpected AWS identity' >&2; exit 1 ;;
          esac
          echo 'AWS_OIDC=PASS'

      - name: Read-only DynamoDB proof
        shell: bash
        run: |
          set -euo pipefail
          aws dynamodb list-tables --output json >/tmp/ddb.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ddb.json'))
          assert isinstance(d.get('TableNames'), list)
          print('DYNAMODB_AUTH_READ=PASS')
          PY

      - name: Live Bedrock proof
        shell: bash
        run: |
          set -euo pipefail
          aws bedrock list-inference-profiles --type-equals SYSTEM_DEFINED --output json >/tmp/profiles.json
          MODEL_ID="$(python - <<'PY'
          import json
          items=json.load(open('/tmp/profiles.json')).get('inferenceProfileSummaries', [])
          for needle in ('nova-2-lite','nova-lite'):
              for x in items:
                  mid=str(x.get('inferenceProfileId') or '')
                  if needle in mid.lower() and mid.startswith('eu.'):
                      print(mid); raise SystemExit
          raise SystemExit('No EU Amazon Nova Lite inference profile available')
          PY
          )"
          cat >/tmp/request.json <<'JSON'
          {"messages":[{"role":"user","content":[{"text":"Return exactly: RIPPLE_CPP_LIVE"}]}],"inferenceConfig":{"maxTokens":16,"temperature":0}}
          JSON
          aws bedrock-runtime invoke-model --model-id "$MODEL_ID" --content-type application/json --accept application/json --cli-binary-format raw-in-base64-out --body fileb:///tmp/request.json /tmp/response.json >/tmp/meta.json
          python - <<'PY'
          import json
          b=json.load(open('/tmp/response.json'))
          c=((b.get('output') or {}).get('message') or {}).get('content') or []
          assert c and str(c[0].get('text') or '').strip()
          print('BEDROCK_LIVE=PASS')
          PY

      - name: Read-only CloudWatch proof
        shell: bash
        run: |
          set -euo pipefail
          aws logs describe-log-groups --log-group-name-prefix /ripple --output json >/tmp/cw.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cw.json'))
          assert isinstance(d.get('logGroups'), list)
          print('CLOUDWATCH_AUTH_READ=PASS')
          PY

      - name: Emit isolated proof status
        run: |
          echo 'RIPPLE_CPP_EXACT_SHA=PASS'
          echo 'AWS_OIDC=PASS'
          echo 'DYNAMODB_AUTH_READ=PASS'
          echo 'BEDROCK_LIVE=PASS'
          echo 'CLOUDWATCH_AUTH_READ=PASS'
          echo 'NO_PRODUCTION_MUTATION=PASS'
