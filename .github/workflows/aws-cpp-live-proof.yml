name: AWS CPP isolated live proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-cpp-live-proof.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ripple-cpp-isolated-live-proof
  cancel-in-progress: false

jobs:
  live-proof:
    if: github.ref == 'refs/heads/main' && github.repository == 'rarescos-pixel/ripple-agentic-plan-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: eu-central-1
      EXPECTED_SHA: e43c3018c5105b2747491283405a68f14aa0c84e
      PROOF_DIR: /tmp/ripple-cpp-proof
    steps:
      - name: Checkout exact verified implementation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Prove exact source under test
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD -- src pyproject.toml
          mkdir -p "$PROOF_DIR"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - name: Record non-secret OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const jwt = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(jwt);
            const claims = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString());
            const safe = Object.fromEntries(['iss', 'aud', 'sub', 'event_name', 'ref', 'repository', 'repository_id', 'workflow_ref'].map(k => [k, claims[k]]));
            require('fs').writeFileSync(process.env.PROOF_DIR + '/oidc-claims.json', JSON.stringify(safe, null, 2));
            core.info('OIDC_CLAIMS=' + JSON.stringify(safe));
      - name: Configure the existing role with a restricted evidence-only session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-cpp-proof-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 2
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"},
              {"Effect":"Allow","Action":["dynamodb:DescribeTable","dynamodb:GetItem","dynamodb:PutItem"],"Resource":"arn:aws:dynamodb:eu-central-1:873363353521:table/ripple-live-evidence-state"},
              {"Effect":"Allow","Action":"bedrock:InvokeModel","Resource":["arn:aws:bedrock:eu-central-1:873363353521:inference-profile/eu.amazon.nova-2-lite-v1:0","arn:aws:bedrock:eu-*::foundation-model/amazon.nova-2-lite-v1:0"]},
              {"Effect":"Allow","Action":"logs:DescribeLogGroups","Resource":"*"},
              {"Effect":"Allow","Action":["logs:PutLogEvents","logs:GetLogEvents"],"Resource":"arn:aws:logs:eu-central-1:873363353521:log-group:/ripple/live-evidence:log-stream:github-actions"}
            ]}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned implementation dependencies
        run: python -m pip install -e '.[aws]' pytest
      - name: Run full tests on the exact implementation SHA
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Verify exact-SHA deterministic build evidence
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python scripts/promise_build_gate.py
          git diff --exit-code -- docs/PROMISE_BUILD_EVIDENCE.json
      - name: Exercise actual CPP adapters against live AWS and independently read back
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python scripts/promise_aws_live_proof.py
      - name: Preserve live evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-cpp-aws-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ripple-cpp-proof/
          if-no-files-found: error
