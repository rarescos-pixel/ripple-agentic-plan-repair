name: AWS canonical final public proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-canonical-final-public-proof.yml']

permissions:
  id-token: write
  contents: read

concurrency:
  group: ripple-aws-canonical-final-public-proof
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: '873363353521'
      ECR_REPOSITORY: ripple-canonical-runtime
      SERVICE_NAME: ripple-canonical
      CLUSTER_NAME: default
      INFRA_ROLE: RippleEcsInfrastructureRole
      EXECUTION_ROLE: RippleEcsTaskExecutionRole
      TASK_ROLE: RippleEcsTaskRole
      BOOTSTRAP_POLICY: RippleExactShaProofBootstrapTemporary
      SERVICE_SECRET_PARAM: /ripple/canonical/service-client-secret
      DEMO_PASSWORD_PARAM: /ripple/canonical/demo-user-password

    steps:
      - uses: actions/checkout@v4

      - name: Assume least-privilege proof bootstrap role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-exact-sha-public-proof
          retry-max-attempts: 2

      - name: Resolve canonical target and cache smoke credentials
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/${CLUSTER_NAME}/${SERVICE_NAME}"
          aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" >/tmp/service.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          service=json.load(open('/tmp/service.json'))['service']
          endpoints=[p['endpoint'].rstrip('/') for c in service.get('activeConfigurations',[]) for p in c.get('ingressPaths',[]) if p.get('accessType')=='PUBLIC' and p.get('endpoint')]
          assert endpoints, service
          base=endpoints[0]
          if not base.startswith('http'):
              base='https://'+base
          print('base_url='+base)
          print('service_arn='+service['serviceArn'])
          PY
          ROLE_ID="$(aws iam get-role --role-name "$INFRA_ROLE" --query 'Role.RoleId' --output text)"
          test "$ROLE_ID" = 'AROA4WWEDF6YQ5P4BQQ7Y'
          echo "role_id=$ROLE_ID" >> "$GITHUB_OUTPUT"
          SERVICE_SECRET="$(aws ssm get-parameter --name "$SERVICE_SECRET_PARAM" --with-decryption --query 'Parameter.Value' --output text)"
          DEMO_PASSWORD="$(aws ssm get-parameter --name "$DEMO_PASSWORD_PARAM" --with-decryption --query 'Parameter.Value' --output text)"
          echo "::add-mask::$SERVICE_SECRET"
          echo "::add-mask::$DEMO_PASSWORD"
          echo "RIPPLE_PROOF_SERVICE_SECRET=$SERVICE_SECRET" >> "$GITHUB_ENV"
          echo "RIPPLE_PROOF_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo 'FINAL_PUBLIC_ENDPOINT_ROLE_ID_AND_SECRETS=PASS'

      - name: Build and push exact-SHA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$DIGEST" && test "$DIGEST" != None
          echo "image_ref=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "FINAL_PUBLIC_IMAGE_DIGEST=$DIGEST"
          echo 'FINAL_PUBLIC_EXACT_SHA_ECR=PASS'

      - name: Register exact-SHA task definition directly
        id: taskdef
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          EXEC_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EXECUTION_ROLE}"
          TASK_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TASK_ROLE}"
          SECRET_ARN="arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/service-client-secret"
          PASSWORD_ARN="arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/demo-user-password"
          IMAGE_REF="$IMAGE_REF" BASE_URL="$BASE_URL" EXEC_ARN="$EXEC_ARN" TASK_ARN="$TASK_ARN" SECRET_ARN="$SECRET_ARN" PASSWORD_ARN="$PASSWORD_ARN" python - <<'PY'
          import json, os
          td={
            'family':'ripple-canonical-custom','networkMode':'awsvpc','requiresCompatibilities':['FARGATE'],'cpu':'256','memory':'512',
            'executionRoleArn':os.environ['EXEC_ARN'],'taskRoleArn':os.environ['TASK_ARN'],
            'containerDefinitions':[{
              'name':'Main','image':os.environ['IMAGE_REF'],'essential':True,
              'portMappings':[{'containerPort':8000,'protocol':'tcp','name':'http','appProtocol':'http'}],
              'environment':[
                {'name':'PORT','value':'8000'},{'name':'AWS_REGION','value':'eu-central-1'},{'name':'RIPPLE_ENV','value':'production'},
                {'name':'RIPPLE_PUBLIC_BASE_URL','value':os.environ['BASE_URL']},{'name':'RIPPLE_ALLOWED_ORIGINS','value':os.environ['BASE_URL']},
                {'name':'RIPPLE_SERVICE_CLIENT_ID','value':'ripple-service'},{'name':'RIPPLE_USER_CLIENT_ID','value':'ripple-user'},
                {'name':'RIPPLE_USER_REDIRECT_URIS','value':os.environ['BASE_URL']+'/oauth/callback'},
                {'name':'RIPPLE_STATE_BACKEND','value':'dynamodb'},{'name':'RIPPLE_DYNAMODB_TABLE','value':'ripple-canonical-state'},
                {'name':'RIPPLE_CHANGE_INTERPRETER','value':'bedrock'},{'name':'RIPPLE_BEDROCK_MODEL_ID','value':'eu.amazon.nova-2-lite-v1:0'},
                {'name':'RIPPLE_TRACE_BACKEND','value':'cloudwatch'},{'name':'RIPPLE_CLOUDWATCH_LOG_GROUP','value':'/ripple/canonical/runtime'},
                {'name':'RIPPLE_CLOUDWATCH_LOG_STREAM','value':'runtime'},{'name':'RIPPLE_REQUIRE_AWS_RUNTIME','value':'true'},
                {'name':'RIPPLE_RELEASE_SHA','value':os.environ['GITHUB_SHA']}
              ],
              'secrets':[
                {'name':'RIPPLE_SERVICE_CLIENT_SECRET','valueFrom':os.environ['SECRET_ARN']},
                {'name':'RIPPLE_DEMO_USER_PASSWORD','valueFrom':os.environ['PASSWORD_ARN']}
              ],
              'logConfiguration':{'logDriver':'awslogs','options':{'awslogs-group':'/ecs/ripple-canonical','awslogs-region':'eu-central-1','awslogs-stream-prefix':'ecs'}}
            }]
          }
          json.dump(td,open('/tmp/taskdef.json','w'))
          PY
          TD_ARN="$(aws ecs register-task-definition --cli-input-json file:///tmp/taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "task_definition_arn=$TD_ARN" >> "$GITHUB_OUTPUT"
          echo "FINAL_PUBLIC_TASK_DEFINITION=$TD_ARN"
          echo 'FINAL_PUBLIC_TASKDEF=PASS'

      - name: Update ECS without changing infrastructure-role trust
        env:
          SERVICE_ARN: ${{ steps.target.outputs.service_arn }}
          TD_ARN: ${{ steps.taskdef.outputs.task_definition_arn }}
          ORIGINAL_ROLE_ID: ${{ steps.target.outputs.role_id }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(aws iam get-role --role-name "$INFRA_ROLE" --query 'Role.RoleId' --output text)"
          test "$BEFORE" = "$ORIGINAL_ROLE_ID"
          aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --task-definition-arn "$TD_ARN" --health-check-path /healthz >/tmp/update.json
          AFTER="$(aws iam get-role --role-name "$INFRA_ROLE" --query 'Role.RoleId' --output text)"
          test "$AFTER" = "$ORIGINAL_ROLE_ID"
          echo 'FINAL_PUBLIC_INFRA_TRUST_UNTOUCHED=PASS'
          echo 'FINAL_PUBLIC_ROLE_ID_PRESERVED=PASS'
          echo 'FINAL_PUBLIC_ECS_UPDATE=PASS'

      - name: Require stable exact-SHA public readiness without AWS privileges
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          STREAK=0
          for i in $(seq 1 180); do
            if curl -fsS --max-time 10 "$BASE_URL/readyz" >/tmp/ready.json 2>/dev/null && BASE_URL="$BASE_URL" python - <<'PY'
          import json, os
          d=json.load(open('/tmp/ready.json'))
          ok=(d.get('status')=='ready' and d.get('runtime_mode')=='aws-structural' and d.get('structural_aws_runtime') is True and d.get('aws_components')==['dynamodb','bedrock','cloudwatch'] and d.get('source_revision')==os.environ['GITHUB_SHA'].lower() and d.get('resource')==os.environ['BASE_URL'].rstrip('/')+'/mcp')
          raise SystemExit(0 if ok else 1)
          PY
            then
              STREAK=$((STREAK+1))
              echo "final_public_exact_streak=$STREAK attempt=$i"
              [ "$STREAK" -ge 6 ] && break
            else
              STREAK=0
            fi
            sleep 5
          done
          test "$STREAK" -ge 6
          cat /tmp/ready.json
          echo 'FINAL_PUBLIC_EXACT_SHA_STABLE=PASS'

      - name: Require stable 7/7 judge-demo evidence without AWS privileges
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          STREAK=0
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 "$BASE_URL/demo/api/evidence" >/tmp/demo-evidence.json 2>/dev/null && python - <<'PY'
          import json
          d=json.load(open('/tmp/demo-evidence.json'))
          rows={row['scenario']: row for row in d.get('scenarios', [])}
          golden=rows.get('golden_flight_cascade', {}).get('observed', {})
          recovery=rows.get('interruption_recovery', {}).get('observed', {})
          ok=(
              d.get('passed') == 7 and d.get('total') == 7 and len(rows) == 7
              and all(row.get('passed') is True for row in d.get('scenarios', []))
              and golden.get('writes') == 5
              and recovery.get('persisted_receipts_before_resume') == 2
              and recovery.get('deduplicated_on_resume') == 2
              and recovery.get('new_writes_on_resume') == 3
              and recovery.get('unique_writes_total') == 5
              and recovery.get('final_status') == 'executed'
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              STREAK=$((STREAK+1))
              echo "final_public_demo_7_of_7_streak=$STREAK attempt=$i"
              [ "$STREAK" -ge 6 ] && break
            else
              STREAK=0
            fi
            sleep 2
          done
          test "$STREAK" -ge 6
          cat /tmp/demo-evidence.json
          echo 'FINAL_PUBLIC_JUDGE_DEMO_7_OF_7_STABLE=PASS'

      - name: Run corrected AWS replay proof and authenticated MCP smoke over HTTPS
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          python -m pip install -q -r requirements.txt
          COMMON="RIPPLE_SMOKE_BASE_URL=$BASE_URL RIPPLE_SERVICE_CLIENT_ID=ripple-service RIPPLE_SERVICE_CLIENT_SECRET=$RIPPLE_PROOF_SERVICE_SECRET RIPPLE_USER_CLIENT_ID=ripple-user RIPPLE_USER_REDIRECT_URI=$BASE_URL/oauth/callback RIPPLE_DEMO_USER_PASSWORD=$RIPPLE_PROOF_DEMO_PASSWORD"
          env $COMMON RIPPLE_EXPECTED_SOURCE_SHA="$GITHUB_SHA" python scripts/aws_runtime_smoke.py
          env $COMMON python scripts/mcp_smoke.py
          echo "FINAL_PUBLIC_CANONICAL_SHA=$GITHUB_SHA"
          echo "FINAL_PUBLIC_ECR_DIGEST=${{ steps.image.outputs.image_digest }}"
          echo 'FINAL_PUBLIC_AWS_AND_MCP_SMOKE=PASS'

      - name: Remove temporary proof bootstrap policy
        if: always()
        shell: bash
        run: |
          set +e
          aws iam delete-role-policy --role-name RippleGitHubOidcRole --policy-name "$BOOTSTRAP_POLICY"
          RC=$?
          if [ "$RC" -eq 0 ]; then
            echo 'FINAL_PUBLIC_TEMP_BOOTSTRAP_DELETE=PASS'
          else
            echo 'FINAL_PUBLIC_TEMP_BOOTSTRAP_DELETE=NOT_PRESENT_OR_NOT_AUTHORIZED'
          fi
          exit 0

# canonical exact-SHA proof refresh marker; no behavioral change
