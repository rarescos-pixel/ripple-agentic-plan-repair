name: Ripple public runtime proof

on:
  push:
    branches: [evidence/public-runtime-proof]

jobs:
  public-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install 'httpx<1,>=0.27'
      - name: Probe deployed production endpoint
        env:
          RIPPLE_SMOKE_BASE_URL: https://ripple-v12-production.up.railway.app
          RIPPLE_EXPECTED_SOURCE_SHA: addef7863ab77dc5c6ac8a8c0f6b543f4339cfea
        run: python scripts/public_runtime_probe.py
