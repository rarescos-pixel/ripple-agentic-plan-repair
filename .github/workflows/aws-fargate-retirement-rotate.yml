name: AWS Fargate retirement direct rotation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-fargate-retirement-rotate.yml']

permissions:
  id-token: write
  contents: read

concurrency:
  group: ripple-fargate-retirement-rotation
  cancel-in-progress: false

jobs:
  rotate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: eu-central-1
      CLUSTER_NAME: default
      SERVICE_NAME: ripple-canonical
      SAFE_AFTER: '2026-09-29T21:00:00Z'
    steps:
      - name: Assume existing GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-fargate-direct-rotation
          retry-max-attempts: 2

      - name: Verify exact AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "$ARN" in
            arn:aws:sts::873363353521:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo "UNEXPECTED_AWS_IDENTITY" >&2; exit 1 ;;
          esac
          echo 'AWS_IDENTITY=PASS'

      - name: Snapshot current ECS service and task
        id: before
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" >/tmp/service-before.json
          python - <<'PY' >/tmp/service-before.txt
          import json
          d=json.load(open('/tmp/service-before.json'))
          assert not d.get('failures'), d
          s=d['services'][0]
          assert s['status']=='ACTIVE', s
          print(s['serviceArn'])
          print(s['taskDefinition'])
          print(s['desiredCount'])
          print(s['runningCount'])
          PY
          mapfile -t S </tmp/service-before.txt
          TASKS="$(aws ecs list-tasks --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" --desired-status RUNNING --query 'taskArns' --output text)"
          test -n "$TASKS" && test "$TASKS" != None
          aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks $TASKS >/tmp/tasks-before.json
          python - <<'PY' >/tmp/task-before.txt
          import json
          ts=json.load(open('/tmp/tasks-before.json'))['tasks']
          assert ts, 'NO_RUNNING_TASKS'
          t=max(ts,key=lambda x:x.get('startedAt',''))
          print(t['taskArn'])
          print(t['taskDefinitionArn'])
          print(t.get('startedAt',''))
          print(t.get('platformVersion',''))
          PY
          mapfile -t T </tmp/task-before.txt
          echo "task_arn=${T[0]}" >> "$GITHUB_OUTPUT"
          echo "task_definition=${S[1]}" >> "$GITHUB_OUTPUT"
          echo "BEFORE_SERVICE_ARN=${S[0]}"
          echo "BEFORE_TASK_DEFINITION=${S[1]}"
          echo "BEFORE_DESIRED_RUNNING=${S[2]}/${S[3]}"
          echo "BEFORE_TASK_ARN=${T[0]}"
          echo "BEFORE_TASK_STARTED_AT=${T[2]}"
          echo "BEFORE_PLATFORM_VERSION=${T[3]}"
          echo 'PRE_ROTATION_SNAPSHOT=PASS'

      - name: Force new deployment only
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --query 'service.{status:status,taskDefinition:taskDefinition,desiredCount:desiredCount}' \
            --output json
          echo 'FORCE_NEW_DEPLOYMENT_ACCEPTED=PASS'
          aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME"
          echo 'SERVICE_STABLE=PASS'

      - name: Prove new post-threshold task and unchanged task definition
        env:
          BEFORE_TASK_ARN: ${{ steps.before.outputs.task_arn }}
          BEFORE_TASK_DEFINITION: ${{ steps.before.outputs.task_definition }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" >/tmp/service-after.json
          AFTER_TD="$(python - <<'PY'
          import json
          s=json.load(open('/tmp/service-after.json'))['services'][0]
          assert s['status']=='ACTIVE', s
          assert s['desiredCount']==s['runningCount']==1, s
          print(s['taskDefinition'])
          PY
          )"
          test "$AFTER_TD" = "$BEFORE_TASK_DEFINITION"
          TASKS="$(aws ecs list-tasks --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" --desired-status RUNNING --query 'taskArns' --output text)"
          test -n "$TASKS" && test "$TASKS" != None
          aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks $TASKS >/tmp/tasks-after.json
          BEFORE_TASK_ARN="$BEFORE_TASK_ARN" SAFE_AFTER="$SAFE_AFTER" python - <<'PY'
          import json,os,datetime
          ts=json.load(open('/tmp/tasks-after.json'))['tasks']
          assert ts, 'NO_RUNNING_TASKS_AFTER'
          t=max(ts,key=lambda x:x.get('startedAt',''))
          assert t['taskArn'] != os.environ['BEFORE_TASK_ARN'], (t['taskArn'],os.environ['BEFORE_TASK_ARN'])
          raw=t.get('startedAt')
          assert raw, t
          started=datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
          safe=datetime.datetime.fromisoformat(os.environ['SAFE_AFTER'].replace('Z','+00:00'))
          assert started > safe, (started,safe)
          print('AFTER_TASK_ARN='+t['taskArn'])
          print('AFTER_TASK_STARTED_AT='+raw)
          print('AFTER_PLATFORM_VERSION='+str(t.get('platformVersion','')))
          print('TASK_REPLACED_AFTER_SAFE_THRESHOLD=PASS')
          PY
          echo 'TASK_DEFINITION_UNCHANGED=PASS'
          echo 'FARGATE_RETIREMENT_ROTATION=PASS'
