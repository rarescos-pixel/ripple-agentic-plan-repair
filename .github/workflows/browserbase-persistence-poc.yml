name: Browserbase Persistence POC

on:
  push:
    branches:
      - poc/free-work-replacement
    paths:
      - scripts/browserbase_persistence_poc.mjs
      - .github/workflows/browserbase-persistence-poc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSERBASE_BROKER_URL: https://hook.eu1.make.com/slzqmwp6l6tsrpako9bob2vqkjv2056o

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Prove persistent Browserbase context
        run: node scripts/browserbase_persistence_poc.mjs

      - name: Show sanitized result
        if: always()
        run: cat browserbase-persistence-result.json

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserbase-persistence-${{ github.run_id }}
          path: browserbase-persistence-result.json
          retention-days: 1
