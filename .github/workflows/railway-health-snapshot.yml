name: Railway health snapshot

on:
  pull_request:
    branches:
      - poc/free-work-replacement
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
      HAS_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN != '' }}
      HAS_RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN != '' }}
      HAS_LIVE_TOKEN: ${{ secrets.LIVE_TOKEN != '' }}
      HAS_BROKER_TOKEN: ${{ secrets.BROKER_TOKEN != '' }}
      HAS_BROWSER_WORKER_TOKEN: ${{ secrets.BROWSER_WORKER_TOKEN != '' }}
    steps:
      - name: Read sanitized worker health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 https://browser-worker-free-production.up.railway.app/healthz)"
          echo "$body" | jq '{ok,browserReady,profilePersistenceConfigured,hasAwsAuthVerify:has("awsAuthVerify"),awsAuthVerify,keys:(keys|sort)}'
          echo "RAILWAY_TOKEN_AVAILABLE=$HAS_RAILWAY_TOKEN"
          echo "RAILWAY_API_TOKEN_AVAILABLE=$HAS_RAILWAY_API_TOKEN"
          echo "RAILWAY_PROJECT_TOKEN_AVAILABLE=$HAS_RAILWAY_PROJECT_TOKEN"
          echo "LIVE_TOKEN_AVAILABLE=$HAS_LIVE_TOKEN"
          echo "BROKER_TOKEN_AVAILABLE=$HAS_BROKER_TOKEN"
          echo "BROWSER_WORKER_TOKEN_AVAILABLE=$HAS_BROWSER_WORKER_TOKEN"

      - name: Inspect GitHub deployment metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?ref=poc%2Ffree-work-replacement&per_page=20" \
            | jq 'map({id,sha,ref,task,environment,created_at,creator:(.creator.login // null)})'
