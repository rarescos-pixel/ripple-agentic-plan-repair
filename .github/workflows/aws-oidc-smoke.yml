name: AWS OIDC Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - poc/free-work-replacement
    paths:
      - '.github/workflows/aws-oidc-smoke.yml'

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect safe OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          OIDC_TOKEN="$TOKEN" python - <<'PY'
          import base64, json, os
          payload = os.environ['OIDC_TOKEN'].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()))
          print('OIDC_SUB=' + str(claims.get('sub', '')))
          print('OIDC_AUD=' + str(claims.get('aud', '')))
          print('OIDC_REPOSITORY=' + str(claims.get('repository', '')))
          print('OIDC_REF=' + str(claims.get('ref', '')))
          PY

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-oidc-smoke
          retry-max-attempts: 2

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ACCOUNT" = "873363353521"
          case "$ARN" in
            arn:aws:sts::873363353521:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo "Unexpected assumed identity" >&2; exit 1 ;;
          esac
          echo "OIDC_SMOKE=PASS"
          echo "ACCOUNT=$ACCOUNT"
          echo "ROLE=RippleGitHubOidcRole"
