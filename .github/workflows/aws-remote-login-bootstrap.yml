name: AWS Remote Login Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - poc/free-work-replacement
    paths:
      - 'aws_bootstrap/**'
      - '.github/workflows/aws-remote-login-bootstrap.yml'

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bootstrap for full AWS verification code
        shell: bash
        run: python aws_bootstrap/patch_long_verification_code.py

      - name: Install latest AWS CLI v2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bootstrap dependencies
        shell: bash
        run: pip install --disable-pip-version-check -r aws_bootstrap/requirements.txt

      - name: Install Cloudflare tunnel client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Run temporary remote-login bridge
        shell: bash
        env:
          AWS_REGION: eu-central-1
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd aws_bootstrap
          uvicorn app:app --host 127.0.0.1 --port 8000 --no-access-log --log-level warning >/tmp/ripple-aws-bootstrap.log 2>&1 &
          APP_PID=$!
          /tmp/cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate >/tmp/ripple-cloudflared.log 2>&1 &
          CF_PID=$!
          cleanup() { kill "$CF_PID" "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          URL=""
          for _ in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/ripple-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo 'Cloudflare quick tunnel did not become ready.' >&2
            sed -n '1,80p' /tmp/ripple-cloudflared.log >&2 || true
            exit 1
          fi

          echo "### Ripple AWS bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Ripple AWS bootstrap::$URL"
          echo "BOOTSTRAP_URL=$URL"
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "BOOTSTRAP_URL=$URL"

          FINAL_PHASE=""
          for _ in $(seq 1 900); do
            STATUS=$(curl -fsS http://127.0.0.1:8000/status || true)
            PHASE=$(python -c 'import json,sys; print(json.loads(sys.stdin.read() or "{}").get("phase", ""))' <<<"$STATUS" 2>/dev/null || true)
            if [ "$PHASE" = "done" ] || [ "$PHASE" = "error" ]; then
              FINAL_PHASE="$PHASE"
              break
            fi
            sleep 2
          done

          if [ "$FINAL_PHASE" != "done" ]; then
            echo "Bootstrap did not complete successfully (phase=${FINAL_PHASE:-timeout})." >&2
            curl -fsS http://127.0.0.1:8000/status >&2 || true
            exit 1
          fi

          echo "OIDC_BOOTSTRAP=PASS"
          echo "✅ AWS authenticated and base OIDC bootstrap completed." >> "$GITHUB_STEP_SUMMARY"

      - name: Bind OIDC role to canonical Ripple AWS live operations
        shell: bash
        env:
          AWS_REGION: eu-central-1
        run: |
          set -euo pipefail
          PROFILE=ripple-bootstrap
          ACCOUNT="$(aws sts get-caller-identity --profile "$PROFILE" --region "$AWS_REGION" --query Account --output text)"
          ROLE=RippleGitHubOidcRole
          POLICY_NAME=RippleGitHubDeployPolicy

          python - "$ACCOUNT" > /tmp/ripple-live-policy.json <<'PY'
          import json, sys
          account = sys.argv[1]
          region = "eu-central-1"
          policy = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Sid": "Identity",
                      "Effect": "Allow",
                      "Action": ["sts:GetCallerIdentity"],
                      "Resource": "*",
                  },
                  {
                      "Sid": "RippleCloudFormation",
                      "Effect": "Allow",
                      "Action": [
                          "cloudformation:ValidateTemplate",
                          "cloudformation:CreateStack",
                          "cloudformation:UpdateStack",
                          "cloudformation:DescribeStacks",
                          "cloudformation:DescribeStackEvents",
                          "cloudformation:CreateChangeSet",
                          "cloudformation:DescribeChangeSet",
                          "cloudformation:ExecuteChangeSet",
                          "cloudformation:DeleteChangeSet",
                          "cloudformation:GetTemplate",
                          "cloudformation:GetTemplateSummary",
                          "cloudformation:ListStackResources"
                      ],
                      "Resource": "*",
                  },
                  {
                      "Sid": "RippleDynamo",
                      "Effect": "Allow",
                      "Action": [
                          "dynamodb:CreateTable", "dynamodb:DescribeTable", "dynamodb:DeleteTable",
                          "dynamodb:UpdateTable", "dynamodb:DescribeContinuousBackups", "dynamodb:UpdateContinuousBackups",
                          "dynamodb:TagResource", "dynamodb:UntagResource", "dynamodb:ListTagsOfResource",
                          "dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:DeleteItem",
                          "dynamodb:Query", "dynamodb:Scan"
                      ],
                      "Resource": [
                          f"arn:aws:dynamodb:{region}:{account}:table/ripple-*",
                          f"arn:aws:dynamodb:{region}:{account}:table/ripple-*/index/*"
                      ],
                  },
                  {
                      "Sid": "RippleLogs",
                      "Effect": "Allow",
                      "Action": [
                          "logs:CreateLogGroup", "logs:DeleteLogGroup", "logs:DescribeLogGroups",
                          "logs:PutRetentionPolicy", "logs:DeleteRetentionPolicy",
                          "logs:CreateLogStream", "logs:DeleteLogStream", "logs:DescribeLogStreams",
                          "logs:PutLogEvents", "logs:GetLogEvents", "logs:FilterLogEvents",
                          "logs:TagResource", "logs:UntagResource", "logs:ListTagsForResource"
                      ],
                      "Resource": "*",
                  },
                  {
                      "Sid": "RippleBedrock",
                      "Effect": "Allow",
                      "Action": [
                          "bedrock:ListFoundationModels", "bedrock:GetFoundationModel", "bedrock:InvokeModel",
                          "bedrock:CreateApplicationInferenceProfile", "bedrock:GetInferenceProfile",
                          "bedrock:DeleteApplicationInferenceProfile", "bedrock:ListInferenceProfiles",
                          "bedrock:TagResource", "bedrock:UntagResource", "bedrock:ListTagsForResource"
                      ],
                      "Resource": "*",
                  },
                  {
                      "Sid": "RippleBudget",
                      "Effect": "Allow",
                      "Action": ["budgets:ViewBudget", "budgets:CreateBudget", "budgets:ModifyBudget", "budgets:DeleteBudget"],
                      "Resource": "*",
                  },
                  {
                      "Sid": "RippleManagedPolicy",
                      "Effect": "Allow",
                      "Action": [
                          "iam:CreatePolicy", "iam:GetPolicy", "iam:GetPolicyVersion", "iam:ListPolicyVersions",
                          "iam:CreatePolicyVersion", "iam:DeletePolicyVersion", "iam:DeletePolicy",
                          "iam:ListEntitiesForPolicy", "iam:TagPolicy", "iam:UntagPolicy"
                      ],
                      "Resource": f"arn:aws:iam::{account}:policy/ripple-*",
                  },
                  {
                      "Sid": "RippleRailwayRuntimeUser",
                      "Effect": "Allow",
                      "Action": [
                          "iam:GetUser", "iam:CreateUser", "iam:DeleteUser", "iam:TagUser", "iam:UntagUser",
                          "iam:ListAttachedUserPolicies", "iam:AttachUserPolicy", "iam:DetachUserPolicy",
                          "iam:ListAccessKeys", "iam:CreateAccessKey", "iam:UpdateAccessKey", "iam:DeleteAccessKey"
                      ],
                      "Resource": f"arn:aws:iam::{account}:user/ripple-railway-runtime",
                  },
              ],
          }
          json.dump(policy, sys.stdout, separators=(",", ":"))
          PY

          aws iam put-role-policy \
            --profile "$PROFILE" \
            --region "$AWS_REGION" \
            --role-name "$ROLE" \
            --policy-name "$POLICY_NAME" \
            --policy-document file:///tmp/ripple-live-policy.json
          rm -f /tmp/ripple-live-policy.json
          echo "CANONICAL_AWS_ROLE_BINDING=PASS"
          echo "✅ OIDC role updated for canonical Ripple AWS live gate." >> "$GITHUB_STEP_SUMMARY"
