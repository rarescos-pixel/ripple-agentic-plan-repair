name: AWS live evidence probe (non-blocking)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-live-integration.yml'

permissions:
  id-token: write
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: eu-central-1
      TABLE_NAME: ripple-live-evidence-state
      LOG_GROUP: /ripple/live-evidence
      LOG_STREAM: github-actions
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-live-proof
          retry-max-attempts: 2

      - name: Verify OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "$ARN" in
            arn:aws:sts::*:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo 'Unexpected AWS identity' >&2; exit 1 ;;
          esac
          echo 'AWS_OIDC=PASS'

      - name: Ensure zero-idle-cost DynamoDB evidence table
        shell: bash
        run: |
          set -euo pipefail
          if aws dynamodb describe-table --table-name "$TABLE_NAME" >/dev/null 2>&1; then
            echo 'DDB_TABLE_ACTION=REUSED'
          else
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --billing-mode PAY_PER_REQUEST \
              --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
              --tags Key=Project,Value=Ripple Key=Purpose,Value=live-evidence \
              >/dev/null
            echo 'DDB_TABLE_ACTION=CREATED'
          fi
          aws dynamodb wait table-exists --table-name "$TABLE_NAME"
          test "$(aws dynamodb describe-table --table-name "$TABLE_NAME" --query 'Table.TableStatus' --output text)" = ACTIVE
          echo 'DYNAMODB_LIVE=PASS'

      - name: Verify durable idempotency receipt in DynamoDB
        shell: bash
        run: |
          set -euo pipefail
          PROOF_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat >/tmp/item.json <<EOF
          {"pk":{"S":"proof#$PROOF_ID"},"sk":{"S":"receipt#normalization"},"purpose":{"S":"ripple-live-proof"}}
          EOF
          aws dynamodb put-item \
            --table-name "$TABLE_NAME" \
            --item file:///tmp/item.json \
            --condition-expression 'attribute_not_exists(pk) AND attribute_not_exists(sk)' \
            >/dev/null
          set +e
          aws dynamodb put-item \
            --table-name "$TABLE_NAME" \
            --item file:///tmp/item.json \
            --condition-expression 'attribute_not_exists(pk) AND attribute_not_exists(sk)' \
            >/tmp/replay.out 2>/tmp/replay.err
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -q 'ConditionalCheckFailed' /tmp/replay.err
          aws dynamodb get-item \
            --table-name "$TABLE_NAME" \
            --key "{\"pk\":{\"S\":\"proof#$PROOF_ID\"},\"sk\":{\"S\":\"receipt#normalization\"}}" \
            --consistent-read \
            --query 'Item.purpose.S' --output text | grep -qx 'ripple-live-proof'
          echo 'DYNAMODB_RECEIPT_LIVE=PASS'
          echo 'AWS_REPLAY_DEDUP=PASS'

      - name: Probe Amazon Nova on Bedrock without fabricating success
        id: bedrock
        shell: bash
        run: |
          set -euo pipefail
          aws bedrock list-inference-profiles --type-equals SYSTEM_DEFINED --output json >/tmp/profiles.json
          MODEL_ID="$(python - <<'PY'
          import json
          items=json.load(open('/tmp/profiles.json')).get('inferenceProfileSummaries', [])
          ids=[str(x.get('inferenceProfileId') or '') for x in items]
          for needle in ('nova-2-lite','nova-lite'):
              for mid in ids:
                  if needle in mid.lower() and mid.startswith('eu.'):
                      print(mid); raise SystemExit
          raise SystemExit('No EU Amazon Nova Lite inference profile available')
          PY
          )"
          echo "BEDROCK_MODEL=$MODEL_ID"
          cat >/tmp/bedrock-request.json <<'JSON'
          {"messages":[{"role":"user","content":[{"text":"Normalize this changed fact in one short phrase only: Our flight home was cancelled and we will land tomorrow at 18:00."}]}],"inferenceConfig":{"maxTokens":32,"temperature":0}}
          JSON
          set +e
          aws bedrock-runtime invoke-model \
            --model-id "$MODEL_ID" \
            --content-type application/json \
            --accept application/json \
            --cli-binary-format raw-in-base64-out \
            --body fileb:///tmp/bedrock-request.json \
            /tmp/bedrock-response.json \
            >/tmp/bedrock-meta.json 2>/tmp/bedrock.err
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            python - <<'PY'
          import json
          body=json.load(open('/tmp/bedrock-response.json'))
          text=((body.get('output') or {}).get('message') or {}).get('content') or []
          assert text and str(text[0].get('text') or '').strip(), body
          PY
            echo 'BEDROCK_LIVE=PASS'
            echo 'status=PASS' >> "$GITHUB_OUTPUT"
          elif grep -qi 'account is currently being verified' /tmp/bedrock.err; then
            echo 'BEDROCK_LIVE=BLOCKED_ACCOUNT_VERIFICATION'
            echo 'status=BLOCKED_ACCOUNT_VERIFICATION' >> "$GITHUB_OUTPUT"
          else
            echo 'BEDROCK_LIVE=FAILED_OTHER'
            sed -E 's/[0-9]{12}/************/g' /tmp/bedrock.err | head -3
            echo 'status=FAILED_OTHER' >> "$GITHUB_OUTPUT"
          fi

      - name: Exercise the actual CloudWatch Logs trace path
        id: cloudwatch
        shell: bash
        run: |
          set -uo pipefail
          PROOF_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" >/tmp/cw-groups.json 2>/tmp/cw.err; then
            echo 'CLOUDWATCH_LOGS=DENIED_DESCRIBE'
            sed -E 's/[0-9]{12}/************/g' /tmp/cw.err | head -2
            echo 'status=DENIED' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName" --output text | grep -qx "$LOG_GROUP"; then
            if ! aws logs create-log-group --log-group-name "$LOG_GROUP" >/tmp/cw-create-group.out 2>/tmp/cw.err; then
              echo 'CLOUDWATCH_LOGS=DENIED_CREATE_GROUP'
              sed -E 's/[0-9]{12}/************/g' /tmp/cw.err | head -2
              echo 'status=DENIED' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          aws logs put-retention-policy --log-group-name "$LOG_GROUP" --retention-in-days 1 >/dev/null 2>/tmp/cw-retention.err || true
          if ! aws logs describe-log-streams --log-group-name "$LOG_GROUP" --log-stream-name-prefix "$LOG_STREAM" --query "logStreams[?logStreamName=='$LOG_STREAM'].logStreamName" --output text | grep -qx "$LOG_STREAM"; then
            if ! aws logs create-log-stream --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" >/tmp/cw-create-stream.out 2>/tmp/cw.err; then
              echo 'CLOUDWATCH_LOGS=DENIED_CREATE_STREAM'
              sed -E 's/[0-9]{12}/************/g' /tmp/cw.err | head -2
              echo 'status=DENIED' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          PROOF_ID="$PROOF_ID" python - <<'PY'
          import json, os, time
          proof_id = os.environ['PROOF_ID']
          message = json.dumps({
              'schema': 'ripple.trace.v1',
              'event_type': 'aws.live.proof',
              'correlation_id': proof_id,
              'payload': {'redacted': True},
          }, sort_keys=True, separators=(',', ':'))
          with open('/tmp/cw-events.json', 'w', encoding='utf-8') as handle:
              json.dump([{'timestamp': int(time.time() * 1000), 'message': message}], handle)
          PY
          if ! aws logs put-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" --log-events file:///tmp/cw-events.json >/tmp/cw-put.json 2>/tmp/cw.err; then
            echo 'CLOUDWATCH_LOGS=DENIED_PUT_OR_INVALID_PAYLOAD'
            sed -E 's/[0-9]{12}/************/g' /tmp/cw.err | head -2
            echo 'status=DENIED_OR_INVALID' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND=0
          for attempt in 1 2 3 4 5; do
            if aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" --start-from-head --limit 10000 --query 'events[].message' --output text >/tmp/cw-read.txt 2>/tmp/cw.err; then
              if grep -Fq "$PROOF_ID" /tmp/cw-read.txt; then
                FOUND=1
                break
              fi
            else
              break
            fi
            sleep 2
          done
          if [ "$FOUND" -eq 1 ]; then
            echo 'CLOUDWATCH_LOGS_LIVE=PASS'
            echo 'status=PASS' >> "$GITHUB_OUTPUT"
          else
            echo 'CLOUDWATCH_LOGS=WRITE_NOT_READABLE_OR_GET_DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/cw.err | head -2
            echo 'status=PARTIAL' >> "$GITHUB_OUTPUT"
          fi

      - name: Emit truthful AWS status
        shell: bash
        run: |
          echo 'AWS_DYNAMODB_STRUCTURAL_EVIDENCE=PASS'
          echo 'AWS_DYNAMODB_REPLAY_DEDUP=PASS'
          echo 'AWS_BEDROCK_STATUS=${{ steps.bedrock.outputs.status }}'
          echo 'AWS_CLOUDWATCH_STATUS=${{ steps.cloudwatch.outputs.status }}'
          if [ '${{ steps.bedrock.outputs.status }}' = 'PASS' ] && [ '${{ steps.cloudwatch.outputs.status }}' = 'PASS' ]; then
            echo 'AWS_DIRECT_LIVE_EVIDENCE=PASS'
          else
            echo 'AWS_DIRECT_LIVE_EVIDENCE=PARTIAL'
          fi
