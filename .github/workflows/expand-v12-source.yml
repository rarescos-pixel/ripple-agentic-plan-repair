name: Expand Ripple v1.2 source

on:
  push:
    branches: [main]
    paths:
      - 'source/ripple-v1.2-full-source.tgz'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive checksum
        run: echo 'baee8b180bab930eac728eb8842c056628367f233f4518fa6dfb82842b7c8cf2  source/ripple-v1.2-full-source.tgz' | sha256sum -c -
      - name: Expand complete v1.2 source
        run: tar -xzf source/ripple-v1.2-full-source.tgz -C .
      - name: Remove one-shot transport artifacts
        run: rm -f source/ripple-v1.2-full-source.tgz .github/workflows/expand-v12-source.yml
      - name: Commit expanded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand complete Ripple v1.2 source and judge packet'
          git push
