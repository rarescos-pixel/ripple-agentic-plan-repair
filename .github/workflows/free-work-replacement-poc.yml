name: Free Work Replacement Browser Runner

on:
  push:
    branches:
      - poc/free-work-replacement
    paths:
      - .github/workflows/free-work-replacement-poc.yml
      - scripts/browser_runner.mjs
      - scripts/browser_bridge_runner.mjs
      - automation/browser-request.json
      - fixtures/browser-automation/**
      - browserbase_function/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSER_REQUEST_PATH: automation/browser-request.json
      ARTIFACT_DIR: artifacts/browser-runner
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ vars.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ vars.BROWSERBASE_CONTEXT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: poc/free-work-replacement

      - name: Generate Browserbase Function lockfile
        run: |
          corepack enable
          cd browserbase_function
          pnpm install --lockfile-only
          cd ..
          if ! git diff --quiet -- browserbase_function/pnpm-lock.yaml || ! git ls-files --error-unmatch browserbase_function/pnpm-lock.yaml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add browserbase_function/pnpm-lock.yaml
            git commit -m "Generate Browserbase Function lockfile"
            git push origin HEAD:poc/free-work-replacement
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect browser provider
        id: provider
        run: |
          PROVIDER="$(node -e "const r=require('./automation/browser-request.json'); process.stdout.write(String(r.provider||'local'))")"
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

      - name: Install Playwright library
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install local Chromium
        if: steps.provider.outputs.provider != 'browserbase-bridge'
        run: npx playwright install --with-deps chromium

      - name: Start local browser fixture server
        if: steps.provider.outputs.provider != 'browserbase-bridge'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/browser-fixture.log 2>&1 &
          echo $! > /tmp/browser-fixture.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/fixtures/browser-automation/form.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/browser-fixture.log
          exit 1

      - name: Run browser request
        run: |
          if [ "${{ steps.provider.outputs.provider }}" = "browserbase-bridge" ]; then
            node scripts/browser_bridge_runner.mjs
          else
            node scripts/browser_runner.mjs
          fi

      - name: Show machine-readable result
        if: always()
        run: |
          if [ -f artifacts/browser-runner/result.json ]; then
            cat artifacts/browser-runner/result.json
          else
            echo '{"ok":false,"error":"result.json was not produced"}'
          fi

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runner-${{ github.run_id }}
          path: artifacts/browser-runner
          if-no-files-found: error
          retention-days: 7
