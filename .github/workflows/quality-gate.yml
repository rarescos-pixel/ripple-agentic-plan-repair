name: Ripple quality gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project + test dependencies
        run: python -m pip install -e . pytest cfn-lint
      - name: Run full test suite
        run: PYTHONPATH=src python -m pytest -q
      - name: Run MCP 2025-11-25 protocol conformance tests explicitly
        run: PYTHONPATH=src python -m pytest -q tests/test_mcp_protocol_2025_11_25.py
      - name: Validate CloudFormation template
        run: cfn-lint infra/ripple-aws.json
      - name: Regenerate executable evidence
        run: |
          PYTHONPATH=src python -m ripple.evaluation.matrix
          PYTHONPATH=src python -m ripple.evaluation.release_gate
          PYTHONPATH=src python -m ripple.evaluation.aws_gate
      - name: Verify generated evidence is committed
        run: git diff --exit-code -- docs/EVIDENCE_MATRIX.md docs/VALIDATION_REPORT.md docs/AWS_READY_REPORT.md
