name: AWS live audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-live-audit.yml'

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-live-audit
          retry-max-attempts: 2

      - name: Verify identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "$ARN" in
            arn:aws:sts::*:assumed-role/RippleGitHubOidcRole/*) ;;
            *) echo 'Unexpected AWS identity' >&2; exit 1 ;;
          esac
          echo 'AWS_OIDC=PASS'

      - name: Audit Ripple live resources without mutation
        shell: bash
        run: |
          set -uo pipefail
          echo '--- CloudFormation ---'
          if aws cloudformation describe-stacks --stack-name ripple-demo --query 'Stacks[0].[StackStatus,LastUpdatedTime,CreationTime]' --output text 2>/tmp/cf.err; then
            echo 'CF_STACK=FOUND'
          else
            echo 'CF_STACK=NOT_FOUND_OR_DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/cf.err | head -3
          fi

          echo '--- DynamoDB ---'
          if TABLES="$(aws dynamodb list-tables --query 'TableNames[?contains(@, `ripple`) || contains(@, `Ripple`)]' --output text 2>/tmp/ddb.err)"; then
            echo "DDB_TABLES=${TABLES:-NONE}"
          else
            echo 'DDB_TABLES=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/ddb.err | head -3
          fi

          echo '--- CloudWatch Logs ---'
          if GROUPS="$(aws logs describe-log-groups --query 'logGroups[?contains(logGroupName, `ripple`) || contains(logGroupName, `Ripple`)].logGroupName' --output text 2>/tmp/logs.err)"; then
            echo "CW_LOG_GROUPS=${GROUPS:-NONE}"
          else
            echo 'CW_LOG_GROUPS=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/logs.err | head -3
          fi

          echo '--- Bedrock ---'
          if PROFILES="$(aws bedrock list-inference-profiles --type-equals APPLICATION --query 'inferenceProfileSummaries[?contains(inferenceProfileName, `ripple`) || contains(inferenceProfileName, `Ripple`)].inferenceProfileName' --output text 2>/tmp/br.err)"; then
            echo "BEDROCK_APP_PROFILES=${PROFILES:-NONE}"
          else
            echo 'BEDROCK_APP_PROFILES=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/br.err | head -3
          fi

          echo '--- Budgets ---'
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if BUDGET="$(aws budgets describe-budget --account-id "$ACCOUNT" --budget-name Ripple-Zero-Cost-Guard --query 'Budget.[BudgetName,BudgetLimit.Amount,BudgetLimit.Unit,CalculatedSpend.ActualSpend.Amount,CalculatedSpend.ActualSpend.Unit,CalculatedSpend.ForecastedSpend.Amount,CostTypes.IncludeCredit]' --output text 2>/tmp/budget.err)"; then
            echo "BUDGET_STATE=$BUDGET"
          else
            echo 'BUDGET_STATE=NOT_FOUND_OR_DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/budget.err | head -3
          fi

          echo 'AWS_LIVE_AUDIT=COMPLETE'

      - name: Audit credits and month-to-date spend read-only
        shell: bash
        run: |
          set -uo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

          echo '--- Free Tier account plan ---'
          if PLAN="$(aws freetier get-account-plan-state --region us-east-1 --query '[accountPlanType,accountPlanStatus,accountPlanRemainingCredits.amount,accountPlanRemainingCredits.unit,accountPlanExpirationDate]' --output text 2>/tmp/plan.err)"; then
            echo "ACCOUNT_PLAN=$PLAN"
          else
            echo 'ACCOUNT_PLAN=DENIED_OR_UNAVAILABLE'
            sed -E 's/[0-9]{12}/************/g' /tmp/plan.err | head -5
          fi

          echo '--- Billing credit ledger ---'
          CREDIT_START="$(date -u -d '11 months ago' +%s)"
          if CREDITS="$(aws billing get-credits --region us-east-1 --account-id "$ACCOUNT" --start-date "$CREDIT_START" --query 'credits[*].[creditType,creditStatus,initialAmount.currencyAmount,remainingAmount.currencyAmount,remainingAmount.currencyCode,endDate]' --output text 2>/tmp/credits.err)"; then
            echo "CREDIT_LEDGER=${CREDITS:-NONE}"
          else
            echo 'CREDIT_LEDGER=DENIED_OR_UNAVAILABLE'
            sed -E 's/[0-9]{12}/************/g' /tmp/credits.err | head -5
          fi

          echo '--- Current month unblended cost ---'
          START="$(date -u +%Y-%m-01)"
          END="$(date -u +%Y-%m-%d)"
          if COST="$(aws ce get-cost-and-usage --region us-east-1 --time-period "Start=$START,End=$END" --granularity MONTHLY --metrics UnblendedCost --query 'ResultsByTime[0].Total.UnblendedCost.[Amount,Unit]' --output text 2>/tmp/cost.err)"; then
            echo "MTD_UNBLENDED_COST=$COST"
          else
            echo 'MTD_UNBLENDED_COST=DENIED_OR_UNAVAILABLE'
            sed -E 's/[0-9]{12}/************/g' /tmp/cost.err | head -5
          fi

          echo 'AWS_BILLING_READ_ONLY_AUDIT=COMPLETE'

      - name: Inspect effective deploy policy read-only
        shell: bash
        run: |
          set -uo pipefail
          if aws iam get-role-policy --role-name RippleGitHubOidcRole --policy-name RippleGitHubDeployPolicy --query PolicyDocument --output json >/tmp/deploy-policy.json 2>/tmp/policy.err; then
            python - <<'PY'
          import json
          p=json.load(open('/tmp/deploy-policy.json'))
          actions=[]
          for s in p.get('Statement',[]):
              a=s.get('Action',[])
              if isinstance(a,str): a=[a]
              actions.extend(a)
          wanted=['iam:PutRolePolicy','iam:DeleteRolePolicy','iam:GetRolePolicy','freetier:GetAccountPlanState','billing:GetCredits','ce:GetCostAndUsage']
          for w in wanted:
              print(f'POLICY_{w}=' + ('PRESENT' if w in actions or '*' in actions else 'ABSENT'))
          PY
            echo 'DEPLOY_POLICY_READ=PASS'
          else
            echo 'DEPLOY_POLICY_READ=DENIED'
            sed -E 's/[0-9]{12}/************/g' /tmp/policy.err | head -5
          fi
