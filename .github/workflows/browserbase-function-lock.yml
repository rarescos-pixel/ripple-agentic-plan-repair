name: Generate Browserbase Function lockfile

on:
  push:
    branches:
      - poc/free-work-replacement
    paths:
      - browserbase_function/package.json
      - .github/workflows/browserbase-function-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: poc/free-work-replacement

      - name: Enable pnpm
        run: corepack enable

      - name: Generate lockfile
        working-directory: browserbase_function
        run: pnpm install --lockfile-only

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- browserbase_function/pnpm-lock.yaml && git ls-files --error-unmatch browserbase_function/pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browserbase_function/pnpm-lock.yaml
          git commit -m "Generate Browserbase Function lockfile"
          git push origin HEAD:poc/free-work-replacement

# Triggered only when package metadata or this generator changes.
