name: Ripple Railway production proof

on:
  push:
    branches:
      - 'railway-proof/**'
  workflow_dispatch:
    inputs:
      expected_source_revision:
        description: 'Exact 40-char Git SHA deployed on canonical Railway service'
        required: true
        type: string

jobs:
  remote-judge-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install remote smoke dependency
        run: python -m pip install httpx
      - name: Resolve exact revision to prove
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REV="${{ inputs.expected_source_revision }}"
          else
            REV="${GITHUB_SHA}"
          fi
          if [[ ! "$REV" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid expected source revision: $REV" >&2
            exit 2
          fi
          echo "revision=${REV,,}" >> "$GITHUB_OUTPUT"
      - name: Verify exact Railway revision and public judge flow
        run: >-
          python scripts/judge_demo_remote_smoke.py
          --base-url https://ripple-v12-production.up.railway.app
          --expected-source-revision "${{ steps.target.outputs.revision }}"
          --attempts 18
          --interval-seconds 5
