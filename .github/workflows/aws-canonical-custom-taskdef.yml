name: AWS canonical custom-taskdef cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-canonical-custom-taskdef.yml']

permissions:
  id-token: write
  contents: read

concurrency:
  group: ripple-aws-custom-taskdef-cutover
  cancel-in-progress: false

jobs:
  cutover-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: '873363353521'
      ECR_REPOSITORY: ripple-canonical-runtime
      SERVICE_NAME: ripple-canonical
      CLUSTER_NAME: default
      TABLE_NAME: ripple-canonical-state
      TRACE_LOG_GROUP: /ripple/canonical/runtime
      TRACE_LOG_STREAM: runtime
      CONTAINER_LOG_GROUP: /ecs/ripple-canonical
      EXECUTION_ROLE: RippleEcsTaskExecutionRole
      INFRA_ROLE: RippleEcsInfrastructureRole
      TASK_ROLE: RippleEcsTaskRole
      SERVICE_CLIENT_ID: ripple-service
      USER_CLIENT_ID: ripple-user
      SERVICE_SECRET_PARAM: /ripple/canonical/service-client-secret
      DEMO_PASSWORD_PARAM: /ripple/canonical/demo-user-password
      GITHUB_OIDC_SUB: repo:rarescos-pixel@321760901/ripple-agentic-plan-repair@1356792571:ref:refs/heads/main

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap stable AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-custom-td-bootstrap
          retry-max-attempts: 2

      - name: Resolve real public endpoint
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/${CLUSTER_NAME}/${SERVICE_NAME}"
          aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" >/tmp/service.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('/tmp/service.json'))['service']
          eps=[p['endpoint'].rstrip('/') for c in s.get('activeConfigurations',[]) for p in c.get('ingressPaths',[]) if p.get('accessType')=='PUBLIC' and p.get('endpoint')]
          assert eps, s
          u=eps[0]
          if not u.startswith('http'): u='https://'+u
          print('base_url='+u)
          print('service_arn='+s['serviceArn'])
          PY
          echo 'REAL_PUBLIC_ENDPOINT=PASS'

      - name: Build and push exact-SHA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker build --pull -t "$ECR_URI:$GITHUB_SHA" .
            docker push "$ECR_URI:$GITHUB_SHA"
          fi
          DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$DIGEST" && test "$DIGEST" != None
          echo "image_ref=$ECR_URI@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo 'EXACT_SHA_ECR_IMAGE=PASS'

      - name: Prepare temporary task-definition registrar
        shell: bash
        run: |
          set -euo pipefail
          MANAGED=arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
          INFRA_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${INFRA_ROLE}"
          EXEC_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EXECUTION_ROLE}"
          TASK_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TASK_ROLE}"
          aws iam delete-role-policy --role-name "$INFRA_ROLE" --policy-name RippleTaskDefinitionRegistrarTemporary >/dev/null 2>&1 || true
          aws iam detach-role-policy --role-name "$INFRA_ROLE" --policy-arn "$MANAGED" >/dev/null 2>&1 || true
          aws iam delete-role --role-name "$INFRA_ROLE" >/dev/null 2>&1 || true
          cat >/tmp/dual-trust.json <<JSON
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Principal":{"Service":"ecs.amazonaws.com"},"Action":"sts:AssumeRole"},
            {"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS_ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":"${GITHUB_OIDC_SUB}"}}}
          ]}
          JSON
          aws iam create-role --role-name "$INFRA_ROLE" --assume-role-policy-document file:///tmp/dual-trust.json >/dev/null
          aws iam attach-role-policy --role-name "$INFRA_ROLE" --policy-arn "$MANAGED"
          cat >/tmp/registrar.json <<JSON
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":["ecs:RegisterTaskDefinition","ecs:DescribeTaskDefinition","ecs:DeregisterTaskDefinition"],"Resource":"*"},
            {"Effect":"Allow","Action":"iam:PassRole","Resource":["$EXEC_ARN","$TASK_ARN"]}
          ]}
          JSON
          aws iam put-role-policy --role-name "$INFRA_ROLE" --policy-name RippleTaskDefinitionRegistrarTemporary --policy-document file:///tmp/registrar.json
          sleep 90
          echo 'TEMP_TASKDEF_REGISTRAR_READY=PASS'

      - name: Assume task-definition registrar
        id: registrar
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleEcsInfrastructureRole
          aws-region: eu-central-1
          role-session-name: ripple-taskdef-registrar
          retry-max-attempts: 12

      - name: Register exact-SHA custom Fargate task definition
        id: taskdef
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          EXEC_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EXECUTION_ROLE}"
          TASK_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TASK_ROLE}"
          SECRET_ARN="arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/service-client-secret"
          PASSWORD_ARN="arn:aws:ssm:${AWS_REGION}:${AWS_ACCOUNT_ID}:parameter/ripple/canonical/demo-user-password"
          IMAGE_REF="$IMAGE_REF" BASE_URL="$BASE_URL" EXEC_ARN="$EXEC_ARN" TASK_ARN="$TASK_ARN" SECRET_ARN="$SECRET_ARN" PASSWORD_ARN="$PASSWORD_ARN" python - <<'PY'
          import json,os
          td={
            "family":"ripple-canonical-custom",
            "networkMode":"awsvpc",
            "requiresCompatibilities":["FARGATE"],
            "cpu":"256","memory":"512",
            "executionRoleArn":os.environ['EXEC_ARN'],
            "taskRoleArn":os.environ['TASK_ARN'],
            "containerDefinitions":[{
              "name":"Main","image":os.environ['IMAGE_REF'],"essential":True,
              "portMappings":[{"containerPort":8000,"protocol":"tcp","name":"http","appProtocol":"http"}],
              "environment":[
                {"name":"PORT","value":"8000"},{"name":"AWS_REGION","value":"eu-central-1"},{"name":"RIPPLE_ENV","value":"production"},
                {"name":"RIPPLE_PUBLIC_BASE_URL","value":os.environ['BASE_URL']},{"name":"RIPPLE_ALLOWED_ORIGINS","value":os.environ['BASE_URL']},
                {"name":"RIPPLE_SERVICE_CLIENT_ID","value":"ripple-service"},{"name":"RIPPLE_USER_CLIENT_ID","value":"ripple-user"},
                {"name":"RIPPLE_USER_REDIRECT_URIS","value":os.environ['BASE_URL']+"/oauth/callback"},
                {"name":"RIPPLE_STATE_BACKEND","value":"dynamodb"},{"name":"RIPPLE_DYNAMODB_TABLE","value":"ripple-canonical-state"},
                {"name":"RIPPLE_CHANGE_INTERPRETER","value":"bedrock"},{"name":"RIPPLE_BEDROCK_MODEL_ID","value":"eu.amazon.nova-2-lite-v1:0"},
                {"name":"RIPPLE_TRACE_BACKEND","value":"cloudwatch"},{"name":"RIPPLE_CLOUDWATCH_LOG_GROUP","value":"/ripple/canonical/runtime"},
                {"name":"RIPPLE_CLOUDWATCH_LOG_STREAM","value":"runtime"},{"name":"RIPPLE_REQUIRE_AWS_RUNTIME","value":"true"},
                {"name":"RAILWAY_GIT_COMMIT_SHA","value":os.environ['GITHUB_SHA']},{"name":"RIPPLE_RELEASE_SHA","value":os.environ['GITHUB_SHA']}
              ],
              "secrets":[
                {"name":"RIPPLE_SERVICE_CLIENT_SECRET","valueFrom":os.environ['SECRET_ARN']},
                {"name":"RIPPLE_DEMO_USER_PASSWORD","valueFrom":os.environ['PASSWORD_ARN']}
              ],
              "logConfiguration":{"logDriver":"awslogs","options":{"awslogs-group":"/ecs/ripple-canonical","awslogs-region":"eu-central-1","awslogs-stream-prefix":"ecs"}}
            }]
          }
          json.dump(td,open('/tmp/taskdef.json','w'))
          PY
          TD_ARN="$(aws ecs register-task-definition --cli-input-json file:///tmp/taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          test -n "$TD_ARN" && test "$TD_ARN" != None
          echo "task_definition_arn=$TD_ARN" >> "$GITHUB_OUTPUT"
          echo "CUSTOM_TASK_DEFINITION=$TD_ARN"
          echo 'CUSTOM_TASKDEF_REGISTERED=PASS'

      - name: Restore stable bootstrap identity
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873363353521:role/RippleGitHubOidcRole
          aws-region: eu-central-1
          role-session-name: ripple-custom-td-update
          retry-max-attempts: 2

      - name: Restore infrastructure role and wait for IAM propagation
        if: steps.registrar.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          MANAGED=arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
          aws iam delete-role-policy --role-name "$INFRA_ROLE" --policy-name RippleTaskDefinitionRegistrarTemporary >/dev/null 2>&1 || true
          aws iam detach-role-policy --role-name "$INFRA_ROLE" --policy-arn "$MANAGED" >/dev/null 2>&1 || true
          aws iam delete-role --role-name "$INFRA_ROLE" >/dev/null 2>&1 || true
          cat >/tmp/service-trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"AllowECSExpressInfrastructure","Effect":"Allow","Principal":{"Service":"ecs.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          JSON
          aws iam create-role --role-name "$INFRA_ROLE" --assume-role-policy-document file:///tmp/service-trust.json >/dev/null
          aws iam attach-role-policy --role-name "$INFRA_ROLE" --policy-arn "$MANAGED"
          echo 'INFRASTRUCTURE_ROLE_RESTORED=PASS'
          sleep 150
          echo 'INFRASTRUCTURE_ROLE_PROPAGATED=PASS'

      - name: Update Express using pre-registered task definition
        id: update
        env:
          SERVICE_ARN: ${{ steps.target.outputs.service_arn }}
          TD_ARN: ${{ steps.taskdef.outputs.task_definition_arn }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TD_ARN"
          aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --task-definition-arn "$TD_ARN" --health-check-path /healthz >/tmp/update.json
          echo 'CUSTOM_TASKDEF_UPDATE_ACCEPTED=PASS'

      - name: Wait for control-plane revision convergence
        env:
          SERVICE_ARN: ${{ steps.target.outputs.service_arn }}
          TD_ARN: ${{ steps.taskdef.outputs.task_definition_arn }}
        shell: bash
        run: |
          set -euo pipefail
          DONE=0
          for i in $(seq 1 180); do
            aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" >/tmp/service-now.json
            if TD_ARN="$TD_ARN" python - <<'PY'
          import json,os
          s=json.load(open('/tmp/service-now.json'))['service']
          c=s.get('activeConfigurations',[])
          ok=len(c)==1 and c[0].get('taskDefinitionArn')==os.environ['TD_ARN']
          raise SystemExit(0 if ok else 1)
          PY
            then
              DONE=1
              echo "control_plane_converged_attempt=$i"
              break
            fi
            echo "control_plane_wait_attempt=$i"
            sleep 10
          done
          test "$DONE" -eq 1
          echo 'CONTROL_PLANE_EXACT_TASKDEF=PASS'

      - name: Require stable public exact-SHA serving
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          STREAK=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 10 "$BASE_URL/readyz" >/tmp/ready.json 2>/dev/null && BASE_URL="$BASE_URL" python - <<'PY'
          import json,os
          d=json.load(open('/tmp/ready.json'))
          ok=(d.get('status')=='ready' and d.get('structural_aws_runtime') is True and d.get('runtime_mode')=='aws-structural' and d.get('aws_components')==['dynamodb','bedrock','cloudwatch'] and d.get('source_revision')==os.environ['GITHUB_SHA'].lower() and d.get('resource')==os.environ['BASE_URL'].rstrip('/')+'/mcp')
          raise SystemExit(0 if ok else 1)
          PY
            then
              STREAK=$((STREAK+1))
              echo "exact_public_streak=$STREAK attempt=$i"
              [ "$STREAK" -ge 6 ] && break
            else
              STREAK=0
              echo "public_not_converged_attempt=$i"
            fi
            sleep 5
          done
          test "$STREAK" -ge 6
          cat /tmp/ready.json
          echo 'PUBLIC_EXACT_SHA_URL_STABLE=PASS'

      - name: Independent AWS-runtime and MCP smoke
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          SERVICE_SECRET="$(aws ssm get-parameter --name "$SERVICE_SECRET_PARAM" --with-decryption --query 'Parameter.Value' --output text)"
          DEMO_PASSWORD="$(aws ssm get-parameter --name "$DEMO_PASSWORD_PARAM" --with-decryption --query 'Parameter.Value' --output text)"
          echo "::add-mask::$SERVICE_SECRET"
          echo "::add-mask::$DEMO_PASSWORD"
          RIPPLE_SMOKE_BASE_URL="$BASE_URL" RIPPLE_SERVICE_CLIENT_ID="$SERVICE_CLIENT_ID" RIPPLE_SERVICE_CLIENT_SECRET="$SERVICE_SECRET" RIPPLE_USER_CLIENT_ID="$USER_CLIENT_ID" RIPPLE_USER_REDIRECT_URI="$BASE_URL/oauth/callback" RIPPLE_DEMO_USER_PASSWORD="$DEMO_PASSWORD" RIPPLE_EXPECTED_SOURCE_SHA="$GITHUB_SHA" python scripts/aws_runtime_smoke.py
          RIPPLE_SMOKE_BASE_URL="$BASE_URL" RIPPLE_SERVICE_CLIENT_ID="$SERVICE_CLIENT_ID" RIPPLE_SERVICE_CLIENT_SECRET="$SERVICE_SECRET" RIPPLE_USER_CLIENT_ID="$USER_CLIENT_ID" RIPPLE_USER_REDIRECT_URI="$BASE_URL/oauth/callback" RIPPLE_DEMO_USER_PASSWORD="$DEMO_PASSWORD" python scripts/mcp_smoke.py
          echo 'CANONICAL_AWS_PUBLIC_PROOF=PASS'

      - name: Verify durable CloudWatch trace and exact ECR digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text | grep -qx "$IMAGE_DIGEST"
          FOUND=0
          for i in 1 2 3 4 5; do
            aws logs get-log-events --log-group-name "$TRACE_LOG_GROUP" --log-stream-name "$TRACE_LOG_STREAM" --start-from-head --limit 10000 --query 'events[].message' --output text >/tmp/traces.txt
            grep -q 'plan.executed' /tmp/traces.txt && grep -q 'change.recorded' /tmp/traces.txt && { FOUND=1; break; }
            sleep 2
          done
          test "$FOUND" -eq 1
          echo 'CLOUDWATCH_CANONICAL_TRACE=PASS'
          echo 'ECR_EXACT_SHA_DIGEST=PASS'
          echo "CANONICAL_AWS_RUNTIME_URL=$BASE_URL"
          echo "CANONICAL_AWS_RUNTIME_SHA=$GITHUB_SHA"
