name: One-shot promise evidence refresh

on:
  push:
    branches: [codex/continuous-promise-preservation]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Refresh promise build evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/continuous-promise-preservation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Regenerate canonical build evidence
        run: PYTHONPATH=src python scripts/promise_build_gate.py
      - name: Commit only regenerated evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)docs/PROMISE_BUILD_EVIDENCE.json'
          if git diff --quiet -- docs/PROMISE_BUILD_EVIDENCE.json; then
            echo 'Evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROMISE_BUILD_EVIDENCE.json
          git commit -m 'Refresh promise build evidence'
          git push origin HEAD:codex/continuous-promise-preservation
