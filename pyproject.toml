[project]
name = "ripple-agentic-plan-repair"
version = "1.4.0"
description = "Money-aware consequence repair agent for Alexa+"
requires-python = ">=3.11"
dependencies = ["starlette>=0.45", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
aws = ["boto3>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ripple-web = "ripple.webapp:serve"
ripple-mcp = "ripple.mcp_server:serve"
